[package]
name = "pulse-core-ffi"
version = "0.0.0"
description = "UniFFI bindings of pulse-core for the Android app (docs/ARCHITECTURE.md section 1)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# `cdylib` is the Android shared library (libpulse_core_ffi.so, built by Gradle through cargo-ndk);
# `lib` lets this crate's own tests and the bindgen tool link it on the host.
crate-type = ["cdylib", "lib"]

[features]
# The Kotlin generator (`uniffi-bindgen` binary). Off by default so the Android library and the
# normal workspace build do not compile clap and the bindgen stack.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[dependencies]
pulse-core = { path = "../core" }
# Same jiff as the core (already in the graph: no size cost), only to turn the epoch seconds the
# Kotlin side passes into the instant type time math takes.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
thiserror = "2.0.21"
# Proc-macro interface (no UDL file). Size cost is measured in T0.7: the scaffolding adds about
# the runtime's lifting and lowering code and a handful of exported symbols.
uniffi = { version = "0.32.2", default-features = false }

[lints]
workspace = true
