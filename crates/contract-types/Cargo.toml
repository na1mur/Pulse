[package]
name = "pulse-contract-types"
version = "0.0.0"
description = "Pulse wire types and typed HTTP client, generated from packages/contract (ADR-0003)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# What src/generated/ needs, no more (spec 9.3). Regenerate with
# `cargo run -p pulse-contract-codegen --locked` (codegen/src/main.rs).
[features]
default = ["client"]
# The typed HTTP client (`Client`). Without it the crate is only the wire types, with no HTTP,
# async runtime or network dependency; pulse-core turns it on with its transport adapter.
client = ["dep:progenitor-client", "dep:reqwest"]

[dependencies]
# Instants (`Timestamp`) and days (`civil::Date`): the core's one date library (spec section 11).
# No time-zone database here; the core's time-math module enables the bundled one.
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
# Pattern checks the contract declares (credit amounts, sha256, period IDs, time zones).
regress = "0.12.0"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", default-features = false, features = ["std", "serde"] }

# The runtime of the generated client: request building, errors, response values.
progenitor-client = { version = "=0.15.1", optional = true }
# HTTP/1.1 only: no HTTP/2, charset sniffing or system proxy (default features off). The TLS
# backend (`rustls`, spec section 11) and its crypto provider are chosen by the transport
# adapter in pulse-core, which also configures the WebSocket client with the same provider.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt"] }

[[test]]
name = "operations"
required-features = ["client"]

[lints]
workspace = true
